<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f6dca5">
<title>我的记录本</title>
<style>
*{box-sizing:border-box}
:root{--bg:#fff7e7;--card:#fffdf8;--ink:#43382d;--muted:#8b7c6c;--line:#eadcc8;--accent:#d99554;--soft:#f7e7ca;--doctor:#dceee7;--shadow:0 8px 24px rgba(86,63,37,.09)}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--ink);background:#f9e7c3}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:auto;padding:18px 16px 110px}
.header{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 18px}
.title h1{font-size:27px;margin:0 0 4px}.title p{margin:0;color:var(--muted);font-size:13px}
.iconBtn{border:0;background:#fff9ed;border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.hero{background:rgba(255,253,248,.92);border:1px solid rgba(255,255,255,.7);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.heroTop{display:flex;justify-content:space-between;gap:12px;align-items:center}
.hero h2{margin:0 0 5px;font-size:19px}.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.doctorBtn{border:0;background:var(--doctor);color:#365f50;padding:11px 14px;border-radius:14px;font-weight:700;white-space:nowrap}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 14px;outline:none;margin:2px 0 12px}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:5px;margin-bottom:10px}
.tab{border:1px solid var(--line);background:#fffaf1;padding:8px 13px;border-radius:999px;color:#725f4c;white-space:nowrap}
.tab.active{background:#5b4b3d;color:white;border-color:#5b4b3d}
.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:14px 3px 9px}
.sectionHead b{font-size:16px}.count{font-size:12px;color:var(--muted)}
.empty{text-align:center;background:rgba(255,255,255,.55);border:1px dashed #dcc9ad;border-radius:18px;padding:35px 15px;color:var(--muted)}
.card{background:var(--card);border:1px solid rgba(226,210,188,.75);border-radius:20px;padding:15px;margin-bottom:10px;box-shadow:0 5px 16px rgba(83,62,37,.06)}
.cardTop{display:flex;justify-content:space-between;gap:10px}
.badge{display:inline-block;font-size:12px;border-radius:999px;padding:5px 9px;background:var(--soft);margin-bottom:7px}
.badge.doctor{background:var(--doctor);color:#35604f}
.card h3{font-size:17px;margin:0 0 6px}.date{font-size:12px;color:var(--muted);white-space:nowrap}
.note{white-space:pre-wrap;font-size:14px;line-height:1.55;color:#5c4f43;margin-top:8px}
.meta{margin-top:9px;padding-top:9px;border-top:1px solid #f0e6d8;font-size:13px;line-height:1.7;color:#66594c}
.actions{display:flex;gap:7px;margin-top:10px;justify-content:flex-end}
.smallBtn{border:0;border-radius:10px;padding:7px 10px;background:#f4eadc;color:#5d4c3c}
.danger{background:#f8e3df;color:#934c40}
.reminder{margin-top:9px;background:#fff2d8;border-radius:12px;padding:8px 10px;font-size:12px;color:#86652d}
.fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:min(688px,calc(100% - 32px));border:0;background:#4d4035;color:white;border-radius:18px;padding:15px;font-weight:800;font-size:16px;box-shadow:0 12px 28px rgba(58,45,34,.28)}
.modal{display:none;position:fixed;inset:0;background:rgba(42,34,27,.38);z-index:20;padding:18px;overflow:auto}
.modal.show{display:block}#medicalModal{z-index:20}#packageModal,#medicalRecordModal,#packageDetailModal,#sessionModal{z-index:30}.sheet{max-width:680px;margin:30px auto;background:#fffaf2;border-radius:25px;padding:19px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.sheet h2{margin:2px 0 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-bottom:11px}.field label{display:block;font-size:12px;color:#786857;margin:0 0 5px}
.field input,.field textarea,.field select{width:100%;border:1px solid #e5d6c1;background:white;border-radius:12px;padding:11px;outline:none}
.field textarea{min-height:88px;resize:vertical}
.full{grid-column:1/-1}.modalBtns{display:flex;gap:9px;margin-top:8px}.modalBtns button{flex:1;border:0;border-radius:13px;padding:12px;font-weight:700}.save{background:#544538;color:white}.cancel{background:#eee3d4;color:#655647}
.settingsRow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.settingsRow button{border:0;background:#f2e5d2;padding:11px;border-radius:12px}

.specialCalendarCard{display:flex;gap:13px;align-items:stretch;padding:13px;margin-bottom:10px;border-radius:18px;background:#fffaf4;box-shadow:0 7px 20px #0000000c}
.specialDateBox{width:72px;min-width:72px;border-radius:15px;background:#fff0f0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 5px;line-height:1}
.specialDateBox .day{font-size:28px;font-weight:800;color:#5b4436}
.specialDateBox .mon{font-size:13px;font-weight:800;color:#8a6d5b;margin-top:7px;letter-spacing:.5px}
.specialCardBody{flex:1;min-width:0}
.specialCardTitle{font-size:17px;font-weight:800;margin:1px 0 5px}
.specialCountdown{font-size:15px;font-weight:700;color:#a65f55;margin:4px 0}
.specialCardActions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:9px}
.specialCardActions .smallBtn{padding:6px 9px;font-size:13px}
.specialDeleteBtn{border:0;background:#f4eadc;border-radius:10px;padding:6px 9px}

.hidden{display:none!important}
@media(max-width:560px){.grid{grid-template-columns:1fr}.heroTop{align-items:flex-start}.doctorBtn{padding:10px 11px}.sheet{margin:5px auto}.wrap{padding-top:13px}}

.medCompact{padding:12px 13px;margin-bottom:8px;border-radius:16px}
.medCompact h3{font-size:16px;margin-bottom:3px}
.medCompact .meta{margin-top:6px;padding-top:6px}
.medCompact .actions{margin-top:7px}
.moreWrap{position:relative}
.moreBtn{border:0;background:#f4eadc;border-radius:10px;padding:5px 10px;font-size:20px;line-height:1}
.moreMenu{position:absolute;right:0;top:34px;z-index:8;min-width:120px;background:white;border:1px solid #eadcc8;border-radius:12px;padding:5px;box-shadow:0 8px 24px rgba(60,45,30,.15)}
.moreMenu button{display:block;width:100%;border:0;background:white;text-align:left;padding:9px 10px;border-radius:8px;color:#5d4c3c}
.moreMenu button:active{background:#f6eee2}

.shinHeader{width:58px;height:50px;object-fit:cover;object-position:center;border-radius:14px;vertical-align:middle;margin-right:7px}
.tabMascot{width:30px;height:30px;object-fit:cover;border-radius:50%;vertical-align:middle;margin-right:6px;box-shadow:0 1px 4px #00000012}
.tab{display:inline-flex;align-items:center;justify-content:center}

.sectionMascot{width:30px;height:30px;object-fit:cover;border-radius:50%;vertical-align:middle;margin-right:6px;box-shadow:0 1px 4px #00000012}

/* V58 - 备忘录添加记录弹窗 */
#memoModal{
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow-y:auto;
}
#memoModal .box{
  width:min(100%,620px);
  max-height:88vh;
  overflow-y:auto;
  background:#fffaf0;
  border-radius:24px;
  padding:22px 20px 20px;
  box-shadow:0 18px 50px #00000025;
}
#memoModal h2{
  margin:0 0 18px;
  font-size:24px;
}
#memoModal .field{
  margin-bottom:14px;
}
#memoModal label{
  display:block;
  margin:0 0 7px;
  font-size:15px;
  color:#675848;
}
#memoModal input,
#memoModal textarea{
  display:block;
  width:100%;
  max-width:100%;
  min-width:0;
  box-sizing:border-box;
  border:1px solid #e2d3bd;
  border-radius:15px;
  background:#fff;
  padding:13px 14px;
  font:inherit;
  color:#3f342b;
  -webkit-appearance:none;
  appearance:none;
}
#memoModal input[type="date"]{
  height:52px;
  line-height:1.2;
}
#memoModal input[type="checkbox"]{
  display:inline-block;
  width:22px;
  height:22px;
  padding:0;
  border-radius:4px;
  -webkit-appearance:checkbox;
  appearance:auto;
}
#memoModal textarea{
  min-height:92px;
  resize:vertical;
}
#memoModal .row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
}
#memoModal .row button{
  width:100%;
  min-height:48px;
  border:0;
  border-radius:15px;
  font-size:17px;
}
#memoModal .cancel{background:#efe3d2;color:#514438}
#memoModal .save{background:#584536;color:#fff}


/* Shopping form only: matching Shin-chan + slightly lower card */
#shoppingModal .sheet{margin-top:95px}
#shoppingModal .shoppingModalMascot{
  width:46px;height:46px;object-fit:cover;border-radius:50%;
  vertical-align:middle;flex:0 0 auto;
}
@media(max-width:560px){
  #shoppingModal .sheet{margin-top:95px}
}


/* Same movement rule on every main page:
   upper controls stay in place; only the records below the second page title scroll. */
html.recordsOnlyScroll, body.recordsOnlyScroll{
  height:100%;
  overflow:hidden;
}
body.recordsOnlyScroll #list{
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding-bottom:110px;
}


/* V128 - 备忘录新增：对应小新 + 卡片往下一点 */
#memoModal{padding-top:52px}
#memoModal h2{display:flex;align-items:center;gap:9px}
#memoModal .memoModalMascot{
  width:46px;height:46px;object-fit:cover;border-radius:50%;flex:0 0 auto;
}


/* V129 - 医疗新增：对应小新、日期格修正、位置参考购物清单 */
#medicalRecordModal .sheet{margin-top:95px}
#medicalRecordModal #medicalRecordTitle{
  display:flex;align-items:center;gap:9px;
}
#medicalRecordModal .medicalRecordMascot{
  width:46px;height:46px;object-fit:cover;border-radius:50%;flex:0 0 auto;
}
#medicalRecordModal .grid{grid-template-columns:1fr}
#medicalRecordModal .field,
#medicalRecordModal .field.full{grid-column:1/-1;min-width:0}
#medicalRecordModal input,
#medicalRecordModal textarea{
  width:100%;max-width:100%;min-width:0;box-sizing:border-box;
}
@media(max-width:560px){
  #medicalRecordModal .sheet{margin-top:95px}
}


/* V130 - medical add final alignment fix */
#medicalRecordModal .sheet{
  margin:95px auto 30px;
  width:calc(100% - 0px);
  max-width:680px;
  overflow:hidden;
}
#medicalRecordModal .grid{display:block}
#medicalRecordModal .field{width:100%;min-width:0}
#medicalRecordModal #medicalDate{
  display:block;
  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;
  height:52px;
  margin:0 !important;
  box-sizing:border-box !important;
  -webkit-appearance:none;
  appearance:none;
}


/* V132 - 医疗配套标题使用医疗对应小新 */
#packageModal #packageFormTitle{display:flex;align-items:center;gap:9px}
#packageModal .packageModalMascot{
  width:46px;height:46px;object-fit:cover;border-radius:50%;flex:0 0 auto;
}


.medicalDatePickerBtn{width:100%;height:52px;border:1px solid #e5d6c1;background:#fff;border-radius:12px;padding:11px;text-align:left;color:#43382d}
#medicalCalendarModal{z-index:60}
#medicalCalendarModal .sheet{max-width:390px;margin:80px auto 30px}
.medCalHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.medCalHead button{border:0;background:#f4eadc;border-radius:10px;width:40px;height:38px;color:#5d4c3c;font-size:20px}
#medicalCalendarTitle{font-weight:800;font-size:17px}
.medCalWeek,.medCalDays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.medCalWeek{color:#8b7c6c;font-size:12px;margin-bottom:6px}
.medCalDay{border:0;background:#fff7e7;border-radius:10px;aspect-ratio:1/1;color:#43382d}
.medCalDay.blank{background:transparent;pointer-events:none}
.medCalDay.today{outline:2px solid #d99554}
.medCalDay.selected{background:#5b4b3d;color:#fff;font-weight:800}


/* 顶部页面按钮：保持正常尺寸，不为了塞进画面而压缩 */
.tabs .tab{
  flex: 0 0 auto !important;
  width: auto !important;
  min-width: max-content !important;
}


/* 修正自定义页面按钮被挤在 customTabs 容器里：
   让每个副本按钮直接成为横向 tabs 的项目 */
#customTabs{display:contents}
.tabs{flex-wrap:nowrap !important;overflow-x:auto !important;overflow-y:hidden !important;-webkit-overflow-scrolling:touch}
.tabs .tab{flex:0 0 auto !important;width:auto !important;min-width:max-content !important}


/* 「删除页面」放进白色圆角格 */
button[onclick*="deleteCustomPage"],
button[onclick*="deletePage"]{
  background:#fff !important;
  border:1px solid #eadfce !important;
  border-radius:14px !important;
  padding:10px 14px !important;
  min-height:48px !important;
}

/* 自定义备忘录/副本：「删除页面」使用小白按钮 */
#memoDeleteTopBtn{
  background:#fff !important;
  border:1px solid #eadfce !important;
  border-radius:14px !important;
  box-shadow:0 2px 6px rgba(70,55,40,.04) !important;
}


/* 备忘录副本：移除外面独立的「删除页面」按钮；删除功能保留在原有小白菜单内 */
#memoDeleteTopBtn{display:none !important;}


/* V-calendar-fixed-shopping-card - 购物清单参考工作列表白色大卡片 */
.shoppingWorkCard{background:var(--card);border:1px solid rgba(226,210,188,.85);border-radius:22px;padding:18px 16px 22px;box-shadow:0 5px 16px rgba(83,62,37,.06);margin-top:2px}
.shoppingWorkHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:13px;border-bottom:1px dashed #e7d8c3}
.shoppingWorkTitle{font-size:19px;font-weight:800;line-height:1.25}
.shoppingWorkDate{font-size:13px;color:var(--muted);margin-top:5px}
.shoppingWorkBadge{white-space:nowrap;background:#fff0b9;color:#7b6330;border-radius:999px;padding:6px 10px;font-size:12px}
.shoppingWorkSection{margin-top:18px}
.shoppingWorkSectionHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.shoppingWorkSectionHead h3{margin:0;font-size:18px}
.shoppingWorkSubsection{margin-top:15px}
.shoppingWorkSubsection h3{margin:0 0 9px;font-size:17px}
.shoppingWorkEmpty{color:var(--muted);font-size:14px;padding:4px 0 8px}
.shoppingWorkCard .card{background:#fffdf8}

</style>
</head>

<div id="photoViewerModal" class="modal" onclick="closePhotoViewer()">
 <div class="sheet" style="max-width:560px;padding:12px" onclick="event.stopPropagation()">

 </div>
</div>

<div id="addPageModal" class="modal">
 <div class="sheet" style="max-width:520px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
   <h2 style="margin:0">＋ 添加页面</h2><button class="smallBtn" onclick="closeAddPageForm()">✕</button>
  </div>
  <label style="display:block;margin:12px 0 6px">页面名称</label>
  <input id="pageName" style="width:100%" placeholder="例如：宠物记录">
  <label style="display:block;margin:12px 0 6px">图标</label>
  <input id="pageIcon" style="width:100%" placeholder="例如：🐶" maxlength="4">
  <label style="display:block;margin:12px 0 6px">Layout</label>
  <select id="pageLayout" style="width:100%" onchange="toggleMedicalButtonNameFields()">
   <option value="normal">📝 普通记录</option>
   <option value="medical">🏥 医疗 Layout</option>
   <option value="checklist">🛒 清单 Layout</option>
   <option value="special">✨ 特别日子 Layout</option>
  </select>
  <label style="display:block;margin:12px 0 6px">分类</label>
  <input id="pageCategories" style="width:100%" placeholder="例如：看医生、洗澡、美容、用品">
  <div class="note" style="margin-top:6px">多个分类用逗号分开；以后新增记录时可以选择。</div>
  <button class="save" style="width:100%;margin-top:18px;border-radius:13px;padding:12px" onclick="saveCustomPage()">添加页面</button>
 </div>
</div>

<div id="customRecordModal" class="modal">
 <div class="sheet">
  <div style="display:flex;justify-content:space-between;align-items:center"><h2 id="customRecordHeading" style="margin:0">新增记录</h2><button class="smallBtn" onclick="closeCustomRecordForm()">✕</button></div>
  <label>日期</label><input id="crDate" type="date">
  <label>标题</label><input id="crTitle" placeholder="标题">
  <div id="crCategoryWrap"><label>分类</label><select id="crCategory"></select></div>
  <label>内容</label><textarea id="crNotes" rows="5" placeholder="记录内容..."></textarea>
  <button class="save" style="width:100%;margin-top:14px" onclick="saveCustomRecord()">保存</button>
 </div>
</div>

<script>
const KEY='myRecordBook_v1';
let records=JSON.parse(localStorage.getItem(KEY)||'[]');
let currentFilter='all';
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const PHOTO_DB='liutai_recordbook_photos_v1',PHOTO_STORE='photos';
function photoDB(){
 return new Promise((resolve,reject)=>{
  const q=indexedDB.open(PHOTO_DB,1);
  q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(PHOTO_STORE))q.result.createObjectStore(PHOTO_STORE)};
  q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);
 });
}
async function photoPut(id,data){
 const db=await photoDB();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).put(data,id);
  tx.oncomplete=()=>{db.close();resolve(id)};tx.onerror=()=>{db.close();reject(tx.error)};
 });
}
async function photoGet(id){
 if(!id)return '';
 const db=await photoDB();
 return new Promise((resolve,reject)=>{
  const q=db.transaction(PHOTO_STORE,'readonly').objectStore(PHOTO_STORE).get(id);
  q.onsuccess=()=>{db.close();resolve(q.result||'')};q.onerror=()=>{db.close();reject(q.error)};
 });
}
async function photoDelete(id){
 if(!id)return;
 const db=await photoDB();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).delete(id);
  tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)};
 });
}
async function migrateInlinePhoto(obj,prefix='p'){
 if(!obj)return obj;
 if(obj.photo && String(obj.photo).startsWith('data:image/')){
  const id=obj.photoId||(`${prefix}_${obj.id||Date.now()}_${Math.random().toString(36).slice(2,7)}`);
  await photoPut(id,obj.photo);obj.photoId=id;obj.photo='';
 }
 return obj;
}

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function label(cat){return {package:'🏥 医生配套',doctor:'🏥 医生记录',medical:'🏥 医疗',birthday:'🎂 生日',anniversary:'❤️ 纪念日',work:'💼 工作',life:'🏠 生活',other:'📝 其他'}[cat]||'📝 其他'}
const shoppingDeletedIds=new Set();
function saveAll(options={}){
  // 防止页面在背景停留较久后，用旧的 records 覆盖掉后来新增的未完成购物项目。
  // 正常保存前，先把 localStorage 里仍存在、但当前内存漏掉的「未完成购物清单」补回来。
  if(!options.replace){
    try{
      const latest=JSON.parse(localStorage.getItem(KEY)||'[]');
      if(Array.isArray(latest)){
        const currentIds=new Set(records.map(r=>String(r.id)));
        latest.forEach(r=>{
          if(r && r.category==='shopping' && !r.customPageId && !r.done &&
             !currentIds.has(String(r.id)) && !shoppingDeletedIds.has(String(r.id))){
            records.push(r);
            currentIds.add(String(r.id));
          }
        });
      }
    }catch(e){console.warn('购物清单保护同步失败',e)}
  }
  localStorage.setItem(KEY,JSON.stringify(records));
}

window.addEventListener('storage',e=>{
  if(e.key!==KEY || !e.newValue)return;
  try{
    const latest=JSON.parse(e.newValue);
    if(Array.isArray(latest)){
      records=latest;
      render();
    }
  }catch(err){}
});

function fitRecordsScrollArea(){
  const list=document.getElementById('list');
  if(!list)return;
  document.documentElement.classList.add('recordsOnlyScroll');
  document.body.classList.add('recordsOnlyScroll');
  const top=list.getBoundingClientRect().top;
  const h=Math.max(120, window.innerHeight-top);
  list.style.height=h+'px';
  list.style.maxHeight=h+'px';
}
window.addEventListener('resize',()=>requestAnimationFrame(fitRecordsScrollArea));

 customPages.filter(p=>p.layout==='medical').forEach(p=>{
   const b=[...document.querySelectorAll('#customTabs .tab')].find(x=>x.getAttribute('onclick')?.includes(`custom:${p.id}`));

   if(im)im.src=src;
 });
}

function syncCustomSpecialMascot(){
 const main=[...document.querySelectorAll('.tabs .tab')].find(x=>x.getAttribute('onclick')?.includes("setFilter('special'"));
 const src=main?.querySelector('.tabMascot')?.src;
 if(!src)return;
 customPages.filter(p=>p.layout==='special').forEach(p=>{
  const tab=[...document.querySelectorAll('#customTabs .tab')].find(x=>x.getAttribute('onclick')?.includes(`custom:${p.id}`));
  if(!tab)return;
  let img=tab.querySelector('.tabMascot');
  if(!img){
   img=document.createElement('img');
   img.className='tabMascot';
   tab.prepend(img);
  }
  img.src=src;
  [...tab.childNodes].filter(n=>n.nodeType===3).forEach(n=>{ if(n.textContent.includes('✨')) n.textContent=n.textContent.replace('✨',''); });
 });
}

function toggleMedicalButtonNameFields(){
 const box=$('medicalButtonNameFields');if(!box)return;
 box.classList.toggle('hidden',$('pageLayout').value!=='medical');
}
function openAddPageForm(){
 $('pageName').value='';$('pageIcon').value='';$('pageLayout').value='normal';$('pageCategories').value='';
 $('pageDoctorButtonName').value='';$('pagePackageButtonName').value='';toggleMedicalButtonNameFields();
 $('addPageModal').classList.add('show');
}
function closeAddPageForm(){$('addPageModal').classList.remove('show')}
function saveCustomPage(){
 const name=$('pageName').value.trim();if(!name){alert('请填写页面名称');return}
 const cats=$('pageCategories').value.split(/[，,]/).map(x=>x.trim()).filter(Boolean);
 customPages.push({id:'p'+Date.now(),icon:$('pageIcon').value.trim()||'📌',name,layout:$('pageLayout').value,categories:cats,
  doctorButtonName:$('pageDoctorButtonName').value.trim()||'＋ 新增',
  packageButtonName:$('pagePackageButtonName').value.trim()||'＋ 配套'});
 saveCustomPages();renderCustomTabs();closeAddPageForm();
}

function deleteCustomPage(id){
 const p=customPages.find(x=>x.id===id);if(!p)return;
 if(confirm(`确定删除「${p.name}」页面吗？里面的记录也会一起删除。`)){
  customPages=customPages.filter(x=>x.id!==id);
  records=records.filter(r=>r.customPageId!==id);
  saveCustomPages();saveAll();currentFilter='life';renderCustomTabs();render();
 }
}

function activeCustomPageId(){
 return currentFilter.startsWith('custom:')?currentFilter.split(':')[1]:'';
}
function belongsToCurrentPage(r){
 const pid=activeCustomPageId();
 return pid ? r.customPageId===pid : !r.customPageId;
}
function openSpecialForm(id=null){
 editingSpecial=id;
 const r=id?records.find(x=>x.id===id):null;
 $('spDate').value=r?.date||'';
 $('spTitle').value=r?.title||'';
 $('spType').value=r?.specialType||'birthday';
 $('spNotes').value=r?.notes||'';
 const specialTab=[...document.querySelectorAll('.tabs .tab')].find(b=>b.getAttribute('onclick')?.includes("setFilter('special'"));
 const src=specialTab?.querySelector('.tabMascot')?.src;
 if(src)$('specialFormMascot').src=src;
 $('specialModal').classList.add('show');
}
function closeSpecialForm(){$('specialModal').classList.remove('show')}
function saveSpecial(){
 const title=$('spTitle').value.trim(),date=$('spDate').value;
 if(!title||!date){alert('请填写日期和名称');return}
 const type=$('spType').value;
 const old=editingSpecial?records.find(x=>x.id===editingSpecial):null;
 const o={id:editingSpecial||('sp'+Date.now()),category:'special',customPageId:old?.customPageId||activeCustomPageId(),specialType:type,date,title,notes:$('spNotes').value.trim(),created:old?.created||Date.now()};
 if(old){records[records.findIndex(x=>x.id===editingSpecial)]=o}else records.push(o);
 saveAll();closeSpecialForm();render();
}

function deleteSpecial(id){if(confirm('确定删除这个特别日子吗？')){records=records.filter(x=>x.id!==id);saveAll();render()}}

const KITCHEN_TODAY_KEY='liutai_kitchen_today_orders_v1';
const KITCHEN_RECIPES_KEY='liutai_kitchen_recipes_v1';
const KITCHEN_PANTRY_KEY='liutai_kitchen_today_ingredients';

function readKitchenPantry(){
 try{
  const v=JSON.parse(localStorage.getItem(KITCHEN_PANTRY_KEY)||'[]');
  return Array.isArray(v)?v:[];
 }catch(e){return []}
}
function kitchenPantryMap(){
 const map=new Map();
 readKitchenPantry().forEach(x=>{
  const name=String(x?.name||'').trim();
  const qty=Number(x?.qty);
  const status=String(x?.status||'').toLowerCase();
  const active=(status?status!=='done':true) && (!Number.isFinite(qty)||qty>0);
  if(name&&active)map.set(kitchenNorm(name),x);
 });
 return map;
}
function kitchenHasAtHome(name){
 return kitchenPantryMap().has(kitchenNorm(name));
}

function readKitchenBridge(key){
 try{
  const v=JSON.parse(localStorage.getItem(key)||'null');
  return Array.isArray(v?.data)?v.data:[];
 }catch(e){return []}
}
function kitchenNorm(s=''){return String(s).trim().toLowerCase().replace(/\s+/g,'')}
function kitchenIngredientNames(recipe){
 let raw=recipe?.ingredients;
 if(typeof raw==='string'){
  try{raw=JSON.parse(raw)}catch(e){raw=raw.split(/[\n,，、]/).map(x=>x.trim()).filter(Boolean)}
 }
 if(!Array.isArray(raw))return [];
 return raw.map(x=>{
  if(typeof x==='string')return x.trim();
  return String(x?.name||x?.ingredient||x?.ingredient_name||'').trim();
 }).filter(Boolean);
}
function generateShoppingFromKitchen(){
 const orders=readKitchenBridge(KITCHEN_TODAY_KEY);
 const recipes=readKitchenBridge(KITCHEN_RECIPES_KEY);
 if(!orders.length){
  alert('刘太厨房还没有今天的菜单资料。\n\n请先打开一次「刘太厨房」，让今日菜单读取完成，再回来按这个按钮。');
  return;
 }
 if(!recipes.length){
  alert('还没有读取到刘太厨房的食谱资料。\n\n请先打开一次「刘太厨房」，让食谱读取完成，再回来按这个按钮。');
  return;
 }
 const recipeMap=new Map(recipes.map(x=>[kitchenNorm(x?.name||x?.recipe_name),x]));
 const names=[];
 const missing=[];
 orders.forEach(o=>{
  const dish=String(o?.recipe_name||o?.food_name||o?.name||'').trim();
  const recipe=recipeMap.get(kitchenNorm(dish));
  if(!recipe){if(dish)missing.push(dish);return}
  names.push(...kitchenIngredientNames(recipe));
 });
 const unique=[]; const seen=new Set();
 names.forEach(name=>{const n=kitchenNorm(name);if(n&&!seen.has(n)){seen.add(n);unique.push(name)}});
 if(!unique.length){
  alert(missing.length?'今天的菜暂时找不到可加入的食材。\n\n没有对应食谱：'+[...new Set(missing)].join('、'):'今天的食谱没有可加入的食材。');
  return;
 }
 const existing=new Set(records.filter(r=>r.category==='shopping'&&!r.customPageId).map(r=>kitchenNorm(r.title)));
 let added=0;
 unique.forEach(name=>{
  const n=kitchenNorm(name); if(existing.has(n))return;
  records.push({id:'shk'+Date.now()+Math.random().toString(36).slice(2,7),category:'shopping',customPageId:null,title:name,qty:'',notes:'',photo:'',done:false,source:'kitchen',created:Date.now()});
  existing.add(n); added++;
 });
 saveAll(); render();
 let msg=added?`已从刘太厨房加入 ${added} 样食材 🛒`:'这些食材已经在购物清单里了 😊';
 if(missing.length)msg+='\n\n没有对应食谱：'+[...new Set(missing)].join('、');
 alert(msg);
}

function compressShopPhoto(file){
 return new Promise((resolve,reject)=>{
  if(!file){resolve(null);return}
  const reader=new FileReader();
  reader.onload=()=>{
   const img=new Image();
   img.onload=()=>{
    const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    resolve(c.toDataURL('image/jpeg',.72));
   };
   img.onerror=reject;img.src=reader.result;
  };
  reader.onerror=reject;reader.readAsDataURL(file);
 });
}

  <div class="field"><label>日期</label><input id="memoDate" type="date"></div>
  <div class="field"><label>名称</label><input id="memoName" placeholder="请输入名称"></div>
  <div class="field"><label>内容</label><textarea id="memoContent" placeholder="请输入内容"></textarea></div>
  <div class="field"><label>链接（选填）</label><input id="memoLink" type="url" inputmode="url" placeholder="https://..."></div>

    <label for="memoPrivate" style="margin:0;flex:1">🔒 保密记录（加密保存） <span id="memoPrivateStatus" style="font-weight:700;color:#8a735e"></span></label>
  </div>
  <div class="row">

   <button class="save" onclick="saveMemo()">保存</button>
  </div>
